<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardTec Compliance Manager — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1117;color:#e8e8e8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1a1d27;border-radius:14px;padding:32px 28px;width:100%;max-width:360px;border:1px solid #2a2d3e}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:20px;font-weight:800;letter-spacing:2px;color:#fff}
.logo p{font-size:12px;color:#9ca3af;margin-top:6px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.f label{font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px}
.f input{background:#0f1117;border:1px solid #2a2d3e;border-radius:8px;color:#e8e8e8;font-size:14px;padding:10px 12px;outline:none;font-family:inherit}
.f input:focus{border-color:#3b82f6}
button{width:100%;background:#3b82f6;color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px}
button:disabled{opacity:.6;cursor:default}
.err{font-size:13px;color:#ef4444;margin-top:12px;text-align:center;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>GUARDTEC</h1>
    <p>COMPLIANCE MANAGER</p>
  </div>
  <form id="loginForm">
    <div class="f"><label>Username</label><input id="username" autocomplete="username" autofocus></div>
    <div class="f"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button type="submit" id="submitBtn">Log In</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  var err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Logging in...';

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    })
  }).then(function(res) {
    return res.json().then(function(r) {
      if (r.ok) {
        window.location.href = '/';
      } else {
        btn.disabled = false; btn.textContent = 'Log In';
        err.textContent = r.error || 'Login failed.';
        err.style.display = 'block';
      }
    });
  }).catch(function() {
    btn.disabled = false; btn.textContent = 'Log In';
    err.textContent = 'Connection error. Is the server running?';
    err.style.display = 'block';
  });
});
</script>
</body>
</html>
