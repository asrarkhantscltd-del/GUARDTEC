server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's own default is 1MB — silently rejects any document/photo
    # upload above that with a bare 413 before it ever reaches the app.
    # Staff reported "can't upload anything"; a phone-camera photo of an
    # SIA card or DBS certificate is routinely 2-8MB, so this was it.
    client_max_body_size 20M;

    # API calls → proxy to the backend container.
    # Docker's embedded DNS (127.0.0.11) is used via a variable + resolver so
    # nginx re-resolves guardtec-app on every request instead of caching its
    # IP for the container's lifetime — otherwise a rebuild/recreate of the
    # app container (new IP) leaves nginx stuck proxying to a dead address
    # until the frontend container itself is restarted.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $upstream_app guardtec-app:3000;
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — any non-file route serves index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
