server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls → proxy to the backend container
    location /api/ {
        proxy_pass http://guardtec-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — any non-file route serves index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
